name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  deployment-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ptah_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      TIME_ZONE: Asia/Dubai
      # Runs against Postgres rather than SQLite on purpose: SQLite ignores
      # VARCHAR length limits, which is how a value-too-long migration bug
      # reached production undetected. sslmode=disable is required because the
      # service container has no TLS, and settings.py only defaults sslmode to
      # "require" when it is not already set.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ptah_ci?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check deployment settings
        run: python manage.py check --deploy

      - name: Verify no missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Show migration plan
        run: python manage.py migrate --plan

      - name: Apply migrations
        run: python manage.py migrate

      - name: Audit tenant integrity
        run: python manage.py audit_tenant_integrity

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run tests
        run: >-
          python manage.py test
          account rasel appointments campaigns directory
          imports messaging reporting common pages
