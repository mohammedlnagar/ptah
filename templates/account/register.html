{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Create your organization</h2>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Create organization and owner account</button>
    </form>
  </div>
</div>
{% endblock %}
