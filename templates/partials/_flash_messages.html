{% if messages %}
  <div class="flash-stack" aria-live="polite">
    {% for message in messages %}
      <div class="flash flash--{{ message.tags|default:'info' }}" role="status">
        <svg><use href="{% if message.tags == 'success' %}#icon-check{% else %}#icon-info{% endif %}"></use></svg>
        <span>{{ message }}</span>
      </div>
    {% endfor %}
  </div>
{% endif %}
