{% if messages %}
  <div class="flash-region" aria-live="polite">
    {% for message in messages %}
      <div class="flash flash--{{ message.tags|default:'info' }}" role="status">
        <svg aria-hidden="true"><use href="{% if message.tags == 'success' %}#r-check{% else %}#r-info{% endif %}"></use></svg>
        <span>{{ message }}</span>
      </div>
    {% endfor %}
  </div>
{% endif %}
