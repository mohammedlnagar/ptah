{% with route=request.resolver_match.url_name %}
<nav class="fnav" id="floatingNav" aria-label="Primary">
  <a class="brandb" href="{% url 'home' %}" aria-label="Waslni overview">
    <span class="bmark" aria-hidden="true">W</span><span class="lbl">Waslni</span>
  </a>
  <span class="divider" aria-hidden="true"></span>

  <a href="{% url 'home' %}" class="{% if route == 'home' %}on{% endif %}"{% if route == 'home' %} aria-current="page"{% endif %}>
    <svg aria-hidden="true"><use href="#r-grid"></use></svg><span class="lbl">Overview</span>
  </a>
  <a href="{% url 'manage_appointments' %}" class="{% if route == 'manage_appointments' %}on{% endif %}"{% if route == 'manage_appointments' %} aria-current="page"{% endif %}>
    <svg aria-hidden="true"><use href="#r-send"></use></svg><span class="lbl">Campaigns</span>
  </a>
  <a href="{% url 'send_queue' %}" class="{% if route == 'appointment_list_detail' or route == 'send_queue' %}on{% endif %}"{% if route == 'appointment_list_detail' %} aria-current="page"{% endif %}>
    <svg aria-hidden="true"><use href="#r-wa"></use></svg><span class="lbl">Send queue</span>
  </a>
  <a href="{% url 'admin_center' %}" class="{% if route == 'admin_center' %}on{% endif %}"{% if route == 'admin_center' %} aria-current="page"{% endif %}>
    <svg aria-hidden="true"><use href="#r-shield"></use></svg><span class="lbl">Admin</span>
  </a>
  <a href="{% url 'profile' %}" class="{% if route == 'profile' or route == 'edit_profile' %}on{% endif %}"{% if route == 'profile' %} aria-current="page"{% endif %}>
    <svg aria-hidden="true"><use href="#r-user"></use></svg><span class="lbl">Profile</span>
  </a>

  <span class="divider" aria-hidden="true"></span>
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit" title="Sign out">
      <svg aria-hidden="true"><use href="#r-x"></use></svg><span class="lbl">Sign out</span>
    </button>
  </form>
</nav>
{% endwith %}
